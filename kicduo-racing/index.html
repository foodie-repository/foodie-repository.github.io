<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>서준레이싱 불러오는 중</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#080b12;color:#f7f8fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loader{text-align:center;padding:32px}.mark{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#b91f2e,#315e8b);font-size:38px;font-weight:900;box-shadow:0 18px 60px #315e8b33}h1{margin:0 0 10px;font-size:clamp(28px,7vw,48px)}p{margin:0;color:#9ea8bb}.spinner{width:44px;height:44px;margin:28px auto 0;border:4px solid #ffffff26;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{max-width:620px;line-height:1.55;color:#ffd45c;white-space:pre-line}</style></head><body><main class="loader"><div class="mark">S</div><h1>서준레이싱</h1><p id="status">새 레이스 화면을 불러오고 있습니다.</p><div class="spinner" id="spinner"></div></main>
<script src="./payload-0.js?v=3"></script><script src="./payload-1.js?v=3"></script><script src="./payload-2.js?v=3"></script><script src="./payload-3.js?v=3"></script><script src="./payload-4.js?v=3"></script><script src="./payload-5.js?v=3"></script><script src="./payload-6.js?v=3"></script><script src="./payload-7.js?v=3"></script><script src="./payload-8.js?v=3"></script>
<script src="./v4-patch-0.js?v=4"></script><script src="./v4-patch-1.js?v=4"></script>
<script>
(async function(){const status=document.getElementById('status'),spinner=document.getElementById('spinner');const hex=buffer=>Array.from(new Uint8Array(buffer),b=>b.toString(16).padStart(2,'0')).join('');const sha=async text=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)));try{if(typeof DecompressionStream!=='function')throw new Error('Chrome 또는 Edge 최신 버전으로 열어주세요.');const payload=window.__SEOJUN_RACING_V3__||'';if(payload.length!==60100)throw new Error('게임 본체 일부를 불러오지 못했습니다. 새로고침해 주세요.');const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));const source=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(await sha(source)!=='bfed97b8354fecead3a34a39121daacc00e33b21848d6e7da5f69f4a27a1ee48')throw new Error('게임 본체 버전이 맞지 않습니다. 새로고침해 주세요.');const patch64=window.__SEOJUN_RACING_V4_PATCH__||'';if(patch64.length!==8176)throw new Error('화면 업데이트 일부를 불러오지 못했습니다. 새로고침해 주세요.');const patchBytes=Uint8Array.from(atob(patch64),c=>c.charCodeAt(0));const patch=JSON.parse(await new Response(new Blob([patchBytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());let lines=source.match(/[^\n]*\n|[^\n]+$/g)||[];if(lines.length!==patch.base_lines)throw new Error('게임 데이터 줄 수가 맞지 않습니다.');for(let i=patch.ops.length-1;i>=0;i--){const [start,end,replacement]=patch.ops[i];lines.splice(start,end-start,...(replacement?[replacement]:[]));}const html=lines.join('');if(html.length!==patch.new_len||await sha(html)!=='185b63a182c73a22003772430f6b91889acdb7306f52ba19714c5ab786aed859')throw new Error('화면 업데이트 검증에 실패했습니다.');document.open();document.write(html);document.close();}catch(error){spinner.hidden=true;status.className='error';status.textContent='게임을 불러오지 못했습니다.\n'+(error?.message||error);console.error(error);}})();
</script></body></html>
