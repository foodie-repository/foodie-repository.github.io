<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1014">
<title>13번 연구실 — 3D 방탈출 게임</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0d;color:#eef7f4;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#17342d,#070a0d 55%);z-index:2}.box{text-align:center;padding:24px}.spinner{width:46px;height:46px;margin:0 auto 16px;border:5px solid rgba(255,255,255,.14);border-top-color:#72f3c6;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{margin:0;color:#a9bdb7;font-weight:700}button{margin-top:16px;padding:10px 16px;border:0;border-radius:10px;background:#72f3c6;color:#04110d;font-weight:900}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#070a0d}</style>
</head>
<body>
<div id="loading"><div class="box"><div class="spinner"></div><p>3D 연구실을 불러오는 중입니다…</p></div></div>
<iframe id="game" title="13번 연구실 3D 방탈출 게임" allow="fullscreen; autoplay; pointer-lock" hidden></iframe>
<script>
(async()=>{
 try{
  if(!('DecompressionStream' in window))throw new Error('이 브라우저는 게임 압축 해제를 지원하지 않습니다. Chrome 또는 Edge에서 열어 주세요.');
  const count=4;
  const encoded=(await Promise.all(Array.from({length:count},(_,i)=>fetch(`parts/${String(i).padStart(3,'0')}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`게임 데이터 ${i+1}을 불러오지 못했습니다.`);return r.text()})))).join('');
  const clean=encoded.replace(/\s+/g,'');
  const bytes=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  const frame=document.getElementById('game');
  frame.srcdoc=html;frame.hidden=false;
  frame.addEventListener('load',()=>document.getElementById('loading')?.remove(),{once:true});
  setTimeout(()=>document.getElementById('loading')?.remove(),2200);
 }catch(error){
  document.querySelector('.box').innerHTML=`<h1>게임을 불러오지 못했습니다</h1><p>${String(error.message||error)}</p><button onclick="location.reload()">다시 시도</button>`;
 }
})();
</script>
</body>
</html>
